# Ставится root'ом в /etc/systemd/system/user@1001.service.d/10-oom-protection.conf
#
# ЗАЧЕМ. Апстримный systemd в /usr/lib/systemd/system/user@.service задаёт
# OOMScoreAdjust=100 — «пользовательские сессии убивать раньше системных служб».
# Для обычной рабочей станции это верно, для этого хоста — нет: боевой портал
# живёт именно в user@1001, рядом с Chrome и vscode-server.
#
# Из manager'ского adj=100 systemd выводит DefaultOOMScoreAdjust=200 для ВСЕХ
# своих служб. Замер 24.08.2026 на живой машине:
#
#   auditmanager-backend (90 МБ)  adj=200  oom_score=801   <- жертва №1 на машине
#   systemd --user (менеджер)     adj=100  oom_score=733   <- жертва №2
#   node/vscode-server (1201 МБ)  adj=0    oom_score=678
#   chrome, claude (≈500 МБ)      adj=0    oom_score=671
#
# То есть прод был назначен первым кандидатом на убийство, а его супервизор —
# вторым. 23.08.2026 так и вышло: OOM-killer снёс бэкенд, а следом сам
# systemd --user, и портал пролежал 12 ч 40 мин, потому что поднимать его
# стало некому.
#
# ЭФФЕКТ. adj=-300 у менеджера; systemd выводит DefaultOOMScoreAdjust=-200
# для его служб, включая бэкенд. Порядок жертв становится осмысленным:
# первым умирает реальный пожиратель памяти (Chrome/vscode-server), а не
# 90-мегабайтный прод. Прод при этом НЕ становится неубиваемым: при росте до
# нескольких ГБ во время аудита он снова поднимется в списке — буфер в 200
# пунктов лишь не даёт убить его вперёд соседей на порядок жирнее.
#
# Рабочий стол под защиту НЕ попадает, и это проверено, а не предположено.
# DefaultOOMScoreAdjust действует только на юниты, которые менеджер форкает
# сам, то есть на *.service. Chrome и vscode-server живут либо в session-*.scope
# (node 1290 МБ), либо в app-code-*.scope / app-com.google.Chrome-*.scope внутри
# самого user@1001.service — но это scope'ы: процессы туда лишь усыновляются,
# и systemd им oom_score_adj не выставляет. Замер подтверждает: у `code`
# adj=0 при adj=200 у службы-бэкенда, а Chrome своим рендерерам сам ставит
# 200/300, чтобы их убивали первыми.
#
# Под защиту попадают ровно 10 служб менеджера: auditmanager-backend, dbus,
# pulseaudio, gpg-agent, dconf, gnome-keyring, gvfs-* и at-spi. Все мелкие,
# и все они 23.08 умирали вместе с продом, разваливая сессию целиком.
#
# ПРИМЕНЕНИЕ: только после `systemctl daemon-reload`, вступает в силу при
# следующем старте user@1001.service (то есть при перезагрузке). Чтобы
# применить к УЖЕ РАБОТАЮЩИМ процессам без простоя — писать напрямую в
# /proc/<pid>/oom_score_adj, см. root-prerequisites.sh.

[Service]
OOMScoreAdjust=-300
