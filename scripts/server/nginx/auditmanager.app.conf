# WebSocket upgrade map: Connection должен зависеть от наличия Upgrade
# (для проксирования wss://.../ws/*). Захардкоженный Connection "upgrade"
# ломал keep-alive для обычных запросов и корректный WS-хендшейк.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name auditmanager.app www.auditmanager.app;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auditmanager.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auditmanager.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.auditmanager.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = auditmanager.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name auditmanager.app www.auditmanager.app;
    return 404; # managed by Certbot
}
