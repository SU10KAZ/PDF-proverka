# This center runs as coder with HOME=/home/coder and ProtectHome=read-only.
# Codex exec --ephemeral still opens installation_id and SQLite state for writing.
# Keep the rest of the home and the immutable releases protected.
[Service]
ReadWritePaths=/home/coder/.codex
ExecStartPre=/usr/bin/test -w /home/coder/.codex
ExecStartPre=/usr/bin/test -w /home/coder/.codex/installation_id
