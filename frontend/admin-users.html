<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи — Audit Manager</title>
    <style>
        :root { --bg:#f3f6fa; --card:#ffffff; --card2:#f7f9fc; --border:#d8e0ea;
                --text:#17233b; --text2:#64748b; --teal:#008f83; --danger:#d92d48; --warn:#a96800; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text);
               font-family:'Onest',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px; }
        header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border); background:var(--card); }
        header a { color:var(--teal); text-decoration:none; }
        h1 { font-size:18px; margin:0; font-weight:600; }
        main { padding:20px 24px; max-width:1550px; }
        .tabs { display:flex; gap:8px; margin-bottom:16px; }
        .tabs button { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px;
                       padding:8px 14px; cursor:pointer; font:inherit; }
        .tabs button.active { border-color:var(--teal); color:var(--teal); }
        table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:10px; }
        th, td { padding:9px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
        th { color:var(--text2); font-weight:500; font-size:12px; }
        .muted { color:var(--text2); font-size:12px; }
        .btn { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:7px;
               padding:5px 10px; cursor:pointer; font:inherit; font-size:12px; margin:2px; }
        .btn:hover { border-color:var(--teal); }
        .btn.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
        .btn.danger { border-color:#efb3bd; color:var(--danger); background:#fff7f8; }
        select { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px; font:inherit; font-size:12px; }
        .status { padding:2px 8px; border-radius:10px; font-size:12px; }
        .s-active { background:#e3f5f2; color:#007b71; }
        .s-pending { background:#fff1d6; color:var(--warn); }
        .s-blocked, .s-rejected { background:#fde8ec; color:var(--danger); }
        .matrix td { padding:3px 6px; border:none; }
        .matrix label { font-size:12px; color:var(--text2); }
        .banner { padding:10px 14px; border-radius:9px; margin-bottom:14px; display:none; }
        .banner.err { display:block; background:#fff0f2; border:1px solid #efb3bd; color:var(--danger); }
        .banner.ok { display:block; background:#e8f7f5; border:1px solid #9cd8d1; color:#006f66; }
        .secret { font-family:'JetBrains Mono',monospace; font-size:15px; padding:4px 8px; background:var(--card2); border-radius:6px; }
        .accounts-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(330px,410px); gap:18px; align-items:start; }
        .accounts-table-wrap { overflow-x:auto; }
        .accounts-list { min-width:600px; }
        .accounts-list td { vertical-align:middle; }
        .accounts-list tbody tr { cursor:pointer; }
        .accounts-list tbody tr:hover { background:var(--card2); }
        .accounts-list tbody tr.selected { background:#e8f7f5; box-shadow:inset 3px 0 var(--teal); }
        .account-select { border:0; padding:0; background:none; color:var(--text); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
        .account-select:focus-visible { outline:2px solid var(--teal); outline-offset:4px; border-radius:2px; }
        .upload-permission { display:flex; align-items:center; gap:5px; font-size:12px; white-space:nowrap; cursor:pointer; }
        input[type=checkbox] { accent-color:var(--teal); }
        .account-details { border:1px solid var(--border); border-radius:10px; padding:18px; background:var(--card); position:sticky; top:16px; }
        .account-details h2 { font-size:18px; margin:0 0 8px; overflow-wrap:anywhere; }
        .account-details h3 { font-size:14px; margin:20px 0 10px; }
        .account-details p { margin:6px 0 14px; }
        .detail-field { display:flex; flex-direction:column; gap:6px; margin:14px 0; color:var(--text2); font-size:12px; }
        .detail-field select { width:100%; color:var(--text); padding:7px; }
        .account-details .matrix td { padding:7px 4px; }
        .account-details .matrix + button { margin-top:10px; }
        @media (max-width:1100px) { .accounts-layout { grid-template-columns:1fr; } .account-details { position:static; } }
        @media (max-width:600px) { main { padding:16px 10px; } header { padding:14px 10px; flex-wrap:wrap; } }
    </style>
</head>
<body>
    <header>
        <a href="/">← Портал</a>
        <h1>Пользователи</h1>
        <span class="muted" id="me"></span>
    </header>
    <main>
        <div class="banner" id="banner"></div>
        <div class="tabs">
            <button data-tab="pending" class="active">Заявки <span id="pending-count"></span></button>
            <button data-tab="accounts">Пользователи</button>
            <button data-tab="events">Журнал</button>
        </div>
        <section id="tab-pending"></section>
        <section id="tab-accounts" style="display:none"></section>
        <section id="tab-events" style="display:none"></section>
    </main>
    <script src="/static/js/admin-users.js?v={{js_version}}"></script>
</body>
</html>
