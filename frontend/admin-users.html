<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи — Audit Manager</title>
    <style>
        :root { --bg:#0d1219; --card:#151d28; --card2:#1a2333; --border:rgba(255,255,255,0.10);
                --text:#e2e8f0; --text2:#8896a6; --teal:#00c2b8; --danger:#e5484d; --warn:#d9a441; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text);
               font-family:'Onest',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px; }
        header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border); }
        header a { color:var(--teal); text-decoration:none; }
        h1 { font-size:18px; margin:0; font-weight:600; }
        main { padding:20px 24px; max-width:1300px; }
        .tabs { display:flex; gap:8px; margin-bottom:16px; }
        .tabs button { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px;
                       padding:8px 14px; cursor:pointer; font:inherit; }
        .tabs button.active { border-color:var(--teal); color:var(--teal); }
        table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:10px; }
        th, td { padding:9px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
        th { color:var(--text2); font-weight:500; font-size:12px; }
        .muted { color:var(--text2); font-size:12px; }
        .btn { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:7px;
               padding:5px 10px; cursor:pointer; font:inherit; font-size:12px; margin:2px; }
        .btn:hover { border-color:var(--teal); }
        .btn.primary { background:var(--teal); color:#04201d; border-color:var(--teal); }
        .btn.danger { border-color:rgba(229,72,77,0.5); color:#ff8a8e; }
        select { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px; font:inherit; font-size:12px; }
        .status { padding:2px 8px; border-radius:10px; font-size:12px; }
        .s-active { background:rgba(0,194,184,0.15); color:var(--teal); }
        .s-pending { background:rgba(217,164,65,0.15); color:var(--warn); }
        .s-blocked, .s-rejected { background:rgba(229,72,77,0.15); color:#ff8a8e; }
        .matrix td { padding:3px 6px; border:none; }
        .matrix label { font-size:12px; color:var(--text2); }
        .banner { padding:10px 14px; border-radius:9px; margin-bottom:14px; display:none; }
        .banner.err { display:block; background:rgba(229,72,77,0.12); border:1px solid rgba(229,72,77,0.35); color:#ff8a8e; }
        .banner.ok { display:block; background:rgba(0,194,184,0.12); border:1px solid rgba(0,194,184,0.35); }
        .secret { font-family:'JetBrains Mono',monospace; font-size:15px; padding:4px 8px; background:var(--card2); border-radius:6px; }
    </style>
</head>
<body>
    <header>
        <a href="/">← Портал</a>
        <h1>Пользователи</h1>
        <span class="muted" id="me"></span>
    </header>
    <main>
        <div class="banner" id="banner"></div>
        <div class="tabs">
            <button data-tab="pending" class="active">Заявки <span id="pending-count"></span></button>
            <button data-tab="accounts">Пользователи</button>
            <button data-tab="events">Журнал</button>
        </div>
        <section id="tab-pending"></section>
        <section id="tab-accounts" style="display:none"></section>
        <section id="tab-events" style="display:none"></section>
    </main>
    <script src="/static/js/admin-users.js?v={{js_version}}"></script>
</body>
</html>
