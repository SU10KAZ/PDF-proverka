<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Audit Manager</title>
    <style>
        :root {
            --bg: #0d1219;
            --card-bg: #151d28;
            --card2-bg: #1a2333;
            --border: rgba(255,255,255,0.10);
            --text: #e2e8f0;
            --text2: #8896a6;
            --teal: #00c2b8;
            --teal-dark: #00a89f;
            --danger: #e5484d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Onest', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 420px;
            margin: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .brand b { color: var(--teal); font-weight: 700; }
        .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: var(--text2); margin: 14px 0 6px; }
        input {
            width: 100%;
            padding: 11px 13px;
            background: var(--card2-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: var(--teal); }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--teal);
            color: #04201d;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }
        button:hover { background: var(--teal-dark); }
        button:disabled { opacity: 0.6; cursor: default; }
        .error {
            display: none;
            margin-top: 16px;
            padding: 10px 12px;
            background: rgba(229,72,77,0.12);
            border: 1px solid rgba(229,72,77,0.35);
            border-radius: 9px;
            color: #ff8a8e;
            font-size: 13px;
        }
        .error.show { display: block; }
        .note {
            margin-top: 16px; padding: 10px 12px; border-radius: 9px; font-size: 13px;
            background: rgba(0,194,184,0.10); border: 1px solid rgba(0,194,184,0.30); color: var(--text);
        }
        .links { margin-top: 18px; font-size: 13px; color: var(--text2); text-align: center; }
        .links a { color: var(--teal); text-decoration: none; }
    </style>
    <style>
        .hint { font-size: 12px; color: var(--text2); margin-top: 4px; }
        .ok { margin-top: 16px; padding: 12px; border-radius: 9px; font-size: 14px;
            background: rgba(0,194,184,0.12); border: 1px solid rgba(0,194,184,0.35); }
    </style>
</head>
<body>
    <form class="card" id="reg-form" autocomplete="on">
        <div class="brand">Audit<b>Manager</b></div>
        <div class="subtitle">Создайте аккаунт. Администратор одобрит доступ и назначит разделы.</div>
        <div id="fields">
            <label for="login">Логин</label>
            <input id="login" name="login" type="text" autocomplete="username" required minlength="3" maxlength="32"
                   pattern="[A-Za-z0-9][A-Za-z0-9._\-]{2,31}">
            <div class="hint">Латинские буквы, цифры, «.», «_», «-»; 3–32 символа.</div>
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
            <div class="hint">Не короче 10 символов и не совпадает с логином.</div>
            <button type="submit" id="submit-btn">Зарегистрироваться</button>
        </div>
        <div class="error" id="error-box"></div>
        <div class="ok" id="ok-box" style="display:none"></div>
        <div class="links" style="margin-top:18px;font-size:13px;text-align:center">
            <a href="/login" style="color:var(--teal);text-decoration:none">Вернуться ко входу</a>
        </div>
    </form>
    <script>
    (function () {
        function message(data, fallback) {
            const d = data && data.detail;
            if (d && typeof d === 'object' && d.message) return d.message;
            if (typeof d === 'string') return d;
            return fallback;
        }
        function showError(msg) { const b = document.getElementById('error-box'); b.textContent = msg; b.classList.add('show'); }
        function clearError() { const b = document.getElementById('error-box'); b.textContent = ''; b.classList.remove('show'); }
        const form = document.getElementById('reg-form');
        const btn = document.getElementById('submit-btn');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearError();
            const v = id => document.getElementById(id).value;
            btn.disabled = true; btn.textContent = 'Отправка…';
            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'AuditManager' },
                    body: JSON.stringify({ login: v('login').trim(), password: v('password') }),
                });
                let data = {};
                try { data = await resp.json(); } catch (_) {}
                if (resp.ok) {
                    document.getElementById('fields').style.display = 'none';
                    const ok = document.getElementById('ok-box');
                    ok.textContent = data.message || 'Заявка отправлена.';
                    ok.style.display = '';
                    return;
                }
                showError(message(data, 'Зарегистрироваться не удалось'));
            } catch (_) {
                showError('Не удалось связаться с сервером. Повторите попытку.');
            } finally {
                btn.disabled = false; btn.textContent = 'Зарегистрироваться';
            }
        });
    })();
    </script>
</body>
</html>
