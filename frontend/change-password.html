<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — Audit Manager</title>
    <style>
        :root {
            --bg: #0d1219;
            --card-bg: #151d28;
            --card2-bg: #1a2333;
            --border: rgba(255,255,255,0.10);
            --text: #e2e8f0;
            --text2: #8896a6;
            --teal: #00c2b8;
            --teal-dark: #00a89f;
            --danger: #e5484d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Onest', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 420px;
            margin: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .brand b { color: var(--teal); font-weight: 700; }
        .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: var(--text2); margin: 14px 0 6px; }
        input {
            width: 100%;
            padding: 11px 13px;
            background: var(--card2-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: var(--teal); }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--teal);
            color: #04201d;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }
        button:hover { background: var(--teal-dark); }
        button:disabled { opacity: 0.6; cursor: default; }
        .error {
            display: none;
            margin-top: 16px;
            padding: 10px 12px;
            background: rgba(229,72,77,0.12);
            border: 1px solid rgba(229,72,77,0.35);
            border-radius: 9px;
            color: #ff8a8e;
            font-size: 13px;
        }
        .error.show { display: block; }
        .note {
            margin-top: 16px; padding: 10px 12px; border-radius: 9px; font-size: 13px;
            background: rgba(0,194,184,0.10); border: 1px solid rgba(0,194,184,0.30); color: var(--text);
        }
        .links { margin-top: 18px; font-size: 13px; color: var(--text2); text-align: center; }
        .links a { color: var(--teal); text-decoration: none; }
    </style>
    <style>
        textarea { width: 100%; min-height: 70px; padding: 11px 13px; background: var(--card2-bg);
            border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 14px;
            font-family: inherit; outline: none; resize: vertical; }
        textarea:focus { border-color: var(--teal); }
        .hint { font-size: 12px; color: var(--text2); margin-top: 4px; }
        .ok { margin-top: 16px; padding: 12px; border-radius: 9px; font-size: 14px;
            background: rgba(0,194,184,0.12); border: 1px solid rgba(0,194,184,0.35); }
    </style>
</head>
<body>
    <form class="card" id="pw-form" autocomplete="on">
        <div class="brand">Audit<b>Manager</b></div>
        <div class="subtitle" id="subtitle">Смена пароля. После смены все прежние сеансы на других
            устройствах будут завершены.</div>
        <div id="fields">
            <label for="current">Текущий (или временный) пароль</label>
            <input id="current" type="password" autocomplete="current-password" required>
            <label for="new1">Новый пароль</label>
            <input id="new1" type="password" autocomplete="new-password" required minlength="10">
            <div class="hint">Не короче 10 символов и не совпадает с логином.</div>
            <label for="new2">Новый пароль ещё раз</label>
            <input id="new2" type="password" autocomplete="new-password" required minlength="10">
            <button type="submit" id="submit-btn">Сменить пароль</button>
        </div>
        <div class="error" id="error-box"></div>
        <div class="ok" id="ok-box" style="display:none"></div>
        <div style="margin-top:18px;font-size:13px;text-align:center">
            <a href="#" id="logout-link" style="color:var(--teal);text-decoration:none">Выйти</a>
        </div>
    </form>
    <script>
    (function () {
        function message(data, fallback) {
            const d = data && data.detail;
            if (d && typeof d === 'object' && d.message) return d.message;
            if (typeof d === 'string') return d;
            return fallback;
        }
        function showError(msg) { const b = document.getElementById('error-box'); b.textContent = msg; b.classList.add('show'); }
        function clearError() { const b = document.getElementById('error-box'); b.textContent = ''; b.classList.remove('show'); }
        fetch('/api/auth/me').then(r => r.json()).then(d => {
            if (!d || !d.authenticated) { window.location.replace('/login'); return; }
            if (d.account && d.account.must_change_password) {
                document.getElementById('subtitle').textContent =
                    'Администратор выдал временный пароль — задайте свой, чтобы продолжить.';
            }
        }).catch(() => {});
        document.getElementById('logout-link').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/auth/logout', { method: 'POST', headers: { 'X-Requested-With': 'AuditManager' } })
                .finally(() => window.location.replace('/login'));
        });
        const form = document.getElementById('pw-form');
        const btn = document.getElementById('submit-btn');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearError();
            const v = id => document.getElementById(id).value;
            if (v('new1') !== v('new2')) { showError('Новые пароли не совпадают'); return; }
            btn.disabled = true;
            try {
                const resp = await fetch('/api/auth/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'AuditManager' },
                    body: JSON.stringify({ current_password: v('current'), new_password: v('new1') }),
                });
                let data = {};
                try { data = await resp.json(); } catch (_) {}
                if (resp.ok) {
                    document.getElementById('fields').style.display = 'none';
                    const ok = document.getElementById('ok-box');
                    ok.textContent = 'Пароль изменён. Переход в портал…';
                    ok.style.display = '';
                    setTimeout(() => window.location.replace('/'), 1200);
                    return;
                }
                showError(message(data, 'Сменить пароль не удалось'));
            } catch (_) {
                showError('Не удалось связаться с сервером. Повторите попытку.');
            } finally {
                btn.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
