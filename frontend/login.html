<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Audit Manager</title>
    <style>
        :root {
            --bg: #0d1219;
            --card-bg: #151d28;
            --card2-bg: #1a2333;
            --border: rgba(255,255,255,0.10);
            --text: #e2e8f0;
            --text2: #8896a6;
            --teal: #00c2b8;
            --teal-dark: #00a89f;
            --danger: #e5484d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Onest', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 360px;
            margin: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .brand b { color: var(--teal); font-weight: 700; }
        .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: var(--text2); margin: 14px 0 6px; }
        input {
            width: 100%;
            padding: 11px 13px;
            background: var(--card2-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: var(--teal); }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--teal);
            color: #04201d;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }
        button:hover { background: var(--teal-dark); }
        button:disabled { opacity: 0.6; cursor: default; }
        .error {
            display: none;
            margin-top: 16px;
            padding: 10px 12px;
            background: rgba(229,72,77,0.12);
            border: 1px solid rgba(229,72,77,0.35);
            border-radius: 9px;
            color: #ff8a8e;
            font-size: 13px;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <form class="card" id="login-form" autocomplete="on">
        <div class="brand">Audit<b>Manager</b></div>
        <div class="subtitle">Вход в портал аудита документации</div>

        <label for="username">Логин</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" id="submit-btn">Войти</button>
        <div class="error" id="error-box"></div>
    </form>

    <script>
        (function () {
            const form = document.getElementById('login-form');
            const btn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-box');

            function showError(msg) {
                errorBox.textContent = msg;
                errorBox.classList.add('show');
            }
            function clearError() {
                errorBox.textContent = '';
                errorBox.classList.remove('show');
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                clearError();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                if (!username || !password) {
                    showError('Введите логин и пароль');
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Вход…';
                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username, password: password }),
                    });
                    let data = {};
                    try { data = await resp.json(); } catch (_) {}
                    if (resp.ok && data.authenticated) {
                        window.location.replace('/');
                        return;
                    }
                    showError((data && data.detail) || 'Неверный логин или пароль');
                } catch (_) {
                    showError('Не удалось связаться с сервером. Повторите попытку.');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Войти';
                }
            });
        })();
    </script>
</body>
</html>
