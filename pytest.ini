[pytest]
testpaths = tests backend/tests
addopts = -p no:cacheprovider
norecursedirs = .git .pytest_cache .pytest_tmp .pytest_tmp2 .codex_test_tmp pytest-cache-files-* tmp_write_probe* tmp_write_probe2* tests/legacy
markers =
    slow: поднимает НАСТОЯЩИЕ процессы (uvicorn, агент, исполнитель); секунды, не миллисекунды. Запускается по умолчанию; отключить — `-m "not slow"`.
