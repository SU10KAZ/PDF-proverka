<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectChange · Research preview</title><link rel="stylesheet" href="style.css">
<header><div><span class="eyebrow">PROJECTCHANGE / RESEARCH PREVIEW</span><h1>Изменения проекта</h1><p>Садовническая 76 · Балчуг Эстейт <span>OLD stage_1 → NEW stage_2</span></p></div><label class="mode"><input id="diagnostic" type="checkbox"> Диагностический вид</label></header>
