<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разметка фрагментов</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<main>
  <header><h1>Разметка фрагментов</h1><a href="/api/export" download="DEV_HUMAN_TRUTH_WAVE1.json">Скачать ответы JSON</a></header>
  <div id="progress" aria-live="polite">Загрузка вопросов…</div>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="recover" hidden>Проверить сохранение</button>
  <section id="complete" hidden><h2>Все ответы сохранены</h2><p>Набор ответов зафиксирован. Разметка завершена.</p><a href="/api/export" download="DEV_HUMAN_TRUTH_WAVE1.json">Скачать итоговый JSON</a></section>
  <section id="task" hidden>
    <div class="task-top"><p id="document"></p><label>Пример <select id="case-select" aria-label="Выбрать пример"></select></label></div>
    <h2 id="question"></h2>
    <p class="hint">Сравните выделенные фрагменты и текст вокруг них. При необходимости откройте PDF.</p>
    <div id="panels"></div>
    <fieldset id="decision"><legend>Ваш ответ</legend>
      <div id="answers" role="group" aria-label="Ваш ответ"></div>
      <button id="problem" class="quiet" type="button" aria-pressed="false">Проблема с примером</button>
      <div id="problem-fields" hidden>
        <label for="problem-reason">Что не так с примером?</label><select id="problem-reason"><option value="">Выберите причину</option></select>
        <label for="note">Комментарий (необязательно)</label><textarea id="note" rows="2" maxlength="2000"></textarea>
      </div>
      <button id="save" class="primary" disabled>Сохранить и дальше</button>
    </fieldset>
    <details id="diagnostics"><summary>Диагностика</summary><pre id="diagnostic-text"></pre></details>
  </section>
</main>
</body></html>
